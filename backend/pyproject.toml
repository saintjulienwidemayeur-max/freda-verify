[project]
name = "freda-verify-backend"
version = "0.1.0"
description = "Freda Verify API (Phase 1: foundation)"
requires-python = ">=3.12"

[tool.ruff]
line-length = 200
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101", "B008"]          # asserts in tests, FastAPI Depends() in defaults

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
