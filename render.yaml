# Render Blueprint: one static site (frontend) + one Docker web service (backend). Database = Supabase (external).
# New > Blueprint > pick this repo. Values marked "sync: false" are secrets you type in the Render dashboard (never in git).
services:
  - type: web
    name: freda-verify-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    domains:
      - api.fredaverify.com         # custom domain (DNS: CNAME api -> freda-verify-api.onrender.com)
    autoDeploy: true
    envVars:
      - key: FV_APP_ENV
        value: prod
      - key: FV_DATABASE_URL        # Supabase "Session pooler" connection string (see CLAUDE.md, section 3.9)
        sync: false
      - key: FV_SECRET_KEY          # generated by Render, kept secret
        generateValue: true
      - key: FV_ENCRYPTION_KEY
        generateValue: true
      - key: FV_CORS_ORIGINS        # JSON list: ["https://freda-verify.onrender.com","https://fredaverify.com","https://www.fredaverify.com"]
        sync: false
      - key: FV_TRUST_PROXY         # Render terminates TLS in front of the container
        value: "true"
      - key: FV_BREVO_API_KEY       # Brevo API key (secret, typed in the dashboard). Without it no e-mail is sent
        sync: false
      - key: FV_MAIL_FROM_EMAIL     # sender verified in Brevo, e.g. no-reply@fredaverify.com
        value: no-reply@fredaverify.com
      - key: FV_AUTO_MIGRATE        # tables are created/updated by the container at every start
        value: "true"

  - type: web
    name: freda-verify
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./out
    domains:
      - fredaverify.com             # custom domains (DNS: see CLAUDE.md, section 3.9)
      - www.fredaverify.com
    envVars:
      - key: NEXT_PUBLIC_API_URL    # public URL of the API: https://api.fredaverify.com once the domain is live (until then https://freda-verify-api.onrender.com)
        sync: false
