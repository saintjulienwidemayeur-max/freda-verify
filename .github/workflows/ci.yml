name: CI
on:
  push:
    branches: [main, "claude/**"]
  pull_request:
permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20, cache: npm}
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:                      # throw-away database that only exists for this job
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-only-throwaway
          POSTGRES_DB: freda_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci -d freda_test" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      FV_TEST_DATABASE_URL: postgresql+psycopg://ci:ci-only-throwaway@localhost:5432/freda_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements-dev.txt}
      - run: sudo apt-get update && sudo apt-get install -y tesseract-ocr fonts-ocr-b
      - name: OCR-B model for Tesseract (pinned by SHA-256)
        run: |
          d="$(dirname "$(find /usr/share/tesseract-ocr -name eng.traineddata | head -1)")"
          sudo curl -fsSL -o "$d/ocrb.traineddata" https://raw.githubusercontent.com/Shreeshrii/tessdata_ocrb/master/ocrb.traineddata
          echo "f4631039e140e674518e8adb39b41751ef62e6338686d5fff6c1c707e591b829  $d/ocrb.traineddata" | sudo sha256sum -c -
      - name: Face models (pinned by SHA-256)
        run: |
          sudo mkdir -p /opt/face-models
          sudo curl -fsSL -o /opt/face-models/face_detection_yunet_2023mar.onnx https://media.githubusercontent.com/media/opencv/opencv_zoo/main/models/face_detection_yunet/face_detection_yunet_2023mar.onnx
          sudo curl -fsSL -o /opt/face-models/face_recognition_sface_2021dec.onnx https://media.githubusercontent.com/media/opencv/opencv_zoo/main/models/face_recognition_sface/face_recognition_sface_2021dec.onnx
          echo "8f2383e4dd3cfbb4553ea8718107fc0423210dc964f9f4280604804ed2552fa4  /opt/face-models/face_detection_yunet_2023mar.onnx" | sha256sum -c -
          echo "0ba9fbfa01b5270c96627c4ef784da859931e02f04419c829e83484087c34e79  /opt/face-models/face_recognition_sface_2021dec.onnx" | sha256sum -c -
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - name: migrations are in sync with the models
        run: |
          FV_DATABASE_URL="$FV_TEST_DATABASE_URL" alembic upgrade head
          FV_DATABASE_URL="$FV_TEST_DATABASE_URL" alembic check
      - run: python -m pytest
