name: CI
on:
  push:
    branches: [main, "claude/**"]
  pull_request:
permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20, cache: npm}
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:                      # throw-away database that only exists for this job
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-only-throwaway
          POSTGRES_DB: freda_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci -d freda_test" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      FV_TEST_DATABASE_URL: postgresql+psycopg://ci:ci-only-throwaway@localhost:5432/freda_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements-dev.txt}
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - name: migrations are in sync with the models
        run: |
          FV_DATABASE_URL="$FV_TEST_DATABASE_URL" alembic upgrade head
          FV_DATABASE_URL="$FV_TEST_DATABASE_URL" alembic check
      - run: python -m pytest
